stage: hole_lora_benchmark
run_id: run_001
searchable:
  lora_r: 8
  learning_rate: 0.0003
  num_epochs: 8
  lora_dropout: 0.05
  lora_alpha: 64
fixed:
  weight_decay: 0.01
  max_seq_length: 4096
  optimizer: adamw_torch
  scheduler: cosine
  warmup_ratio: 0.1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  logging_steps: 1
  eval_steps: 200
  save_steps: 50
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - o_proj
  - gate_proj
  - up_proj
  - down_proj
reproducibility:
  seed: 42
  dataset_version: hole_lora_v1
  dataset_path: training/experiments/hole_lora_benchmark/hole_lora_training_data.jsonl
  model_version: Qwen/Qwen2.5-3B-Instruct
  base_config: training/configs/qwen_3b.yaml
  split_manifest_path: training/experiments/hole_lora_benchmark/split_manifest.json
  split_strategy: geometry_aware
  val_ratio: 0.1
