# Model configuration for CAD Copilot V1 local fine-tuning.
# Switch models by changing `family` and `hf_model_id`, or point to another config file.

model:
  name: qwen2.5-3b-instruct
  family: qwen
  hf_model_id: Qwen/Qwen2.5-3B-Instruct
  trust_remote_code: false

paths:
  checkpoints: training/checkpoints
  outputs: training/outputs
  dataset: dataset_v1/train/training_data.jsonl
  hf_cache: null

inference:
  max_new_tokens: 128
  temperature: 0.7
  do_sample: true

# Reserved for upcoming LoRA / QLoRA training (not implemented yet).
training:
  method: lora
  lora:
    enabled: false
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules: null
  qlora:
    enabled: false
    load_in_4bit: true
    bnb_4bit_compute_dtype: bfloat16
    bnb_4bit_quant_type: nf4
