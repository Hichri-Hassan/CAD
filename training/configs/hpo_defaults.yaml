# Fixed training hyperparameters for hierarchical LoRA HPO.
# Searchable parameters are defined per-stage in hpo_stages.yaml.

reproducibility:
  seed: 42
  dataset_version: dataset_v1_train_200
  dataset_path: dataset_v1/train/training_data.jsonl
  model_version: Qwen/Qwen2.5-3B-Instruct
  base_config: training/configs/qwen_3b.yaml

fixed:
  weight_decay: 0.01
  max_seq_length: 4096
  optimizer: adamw_torch
  scheduler: cosine
  warmup_ratio: 0.1
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 4
  logging_steps: 10
  eval_steps: 50
  save_steps: 100
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# Sensible defaults used before a parameter is optimized in its stage.
stage_defaults:
  lora_r: 16
  learning_rate: 2.0e-4
  num_epochs: 3
  lora_dropout: 0.05
  lora_alpha: 32

paths:
  experiments_root: training/experiments
